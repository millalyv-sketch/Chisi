plugins {
    id 'com.android.application'
}
android {
    namespace 'it.nunzia.chisi'
    compileSdk 34
    defaultConfig {
        applicationId 'it.nunzia.chisi'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '3.1'
    }
    signingConfigs {
        fisso {
            storeFile file('chisi.keystore')
            storePassword 'chisi1234'
            keyAlias 'chisi'
            keyPassword 'chisi1234'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fisso }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
